name: CI LOC MNS

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw -B test
      - name: Package
        run: ./mvnw -B clean package -DskipTests

  docker-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USER }}/projet-fil-rouge:latest .
      - name: Push image
        run: docker push ${{ secrets.DOCKER_USER }}/projet-fil-rouge:latest

  deploy:
    runs-on: self-hosted
    needs: docker-push
    steps:
      - name: Deploie sur la VM
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          cd ~/locmns
          docker compose pull
          docker compose up -d
